
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Monitor</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f4f4f4;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
<main>
  <h2>Wallet Monitor</h2>
  <p>Pi Testnet SDK Connection Test</p>
  <p id="status">Pi SDK detected.</p>
  <button id="login">Sign in with Pi</button>
  <p id="result"></p>
  <button id="checkBalance">اختبار قراءة رصيد Mainnet</button>
<p id="balanceResult"></p>
</main>

  <script>
  const status = document.getElementById("status");
  const loginButton = document.getElementById("login");
  const result = document.getElementById("result");

  try {
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    status.textContent = "Pi SDK initialized successfully.";

    loginButton.addEventListener("click", async function () {
      result.textContent = "Signing in...";

      try {
        const auth = await Pi.authenticate(
          ["username"],
          function (payment) {
            console.log("Incomplete payment:", payment);
          }
        );

        result.textContent =
          "Welcome, " + auth.user.username;
      } catch (error) {
        result.textContent =
          "Sign in failed: " + error.message;
      }
    });

  } catch (error) {
    status.textContent = "SDK initialization error.";
  }
    
const balanceId =
  "00000000ab80ac73f8537778eeed00ee39159cf73f7cd26cf81136f7efc9974ad815b942";

const oldWallet =
  "GDTNZX26BAROLSLYPMR6ROWJE362IAIIRBCFXHJQLIPSAPV4BPZQL4JD";

const result = document.getElementById("balanceResult");

async function checkBalance() {
  result.textContent = "جارٍ فحص الرصيد...";

  try {
    const response = await fetch(
      "https://api.mainnet.minepi.com/claimable_balances/" + balanceId
    );

    if (response.status === 404) {
      result.textContent =
        "الرصيد غير موجود حاليًا. يلزم التحقق من حالته.";
      return;
    }

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    const claimant = data.claimants.find(
      item => item.destination === oldWallet
    );

    if (!claimant) {
      result.textContent = "لم يتم العثور على المستفيد المطلوب.";
      return;
    }

    const unlockDate =
      claimant.predicate?.not?.abs_before;

    if (!unlockDate) {
      result.textContent = "تعذر قراءة موعد فك القفل.";
      return;
    }

    const unlocked =
      Date.now() >= new Date(unlockDate).getTime();

    result.textContent =
      "آخر فحص: " + new Date().toLocaleTimeString("ar-EG") +
      "\nالرصيد: " + data.amount + " Pi" +
      "\nالحالة: " +
      (unlocked
        ? "تحقق الشرط الزمني للمطالبة"
        : "ما زال مقفلاً") +
      "\nموعد فك القفل: " +
      new Date(unlockDate).toLocaleString("ar-EG") +
      "\nالفحص التالي خلال 15 ثانية";
  } catch (error) {
    result.textContent =
      "تعذر تحديث البيانات: " + error.message;
  }
}

document.getElementById("checkBalance").onclick = checkBalance;

// فحص فوري ثم إعادة الفحص كل 15 ثانية
checkBalance();
setInterval(checkBalance, 15000);

</script>
</body>
</html>
